<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, hsl(243, 66%, 45%) 0%, #1a1a4e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #FFD700;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FFD700;
        }
        
        .stat-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            position: relative;
            transform-style: preserve-3d;
        }
        
        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .card.flipped {
            background: white;
            transform: rotateY(180deg);
        }
        
        .card.matched {
            background: #2ECC71;
            cursor: default;
            animation: matchPulse 0.5s ease;
        }
        
        @keyframes matchPulse {
            0%, 100% { transform: scale(1) rotateY(180deg); }
            50% { transform: scale(1.1) rotateY(180deg); }
        }
        
        .card-content {
            backface-visibility: hidden;
            transform: rotateY(180deg);
        }
        
        .card-back {
            position: absolute;
            backface-visibility: hidden;
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #FFD700;
            color: #333;
        }
        
        .btn-primary:hover {
            background: #FFC000;
            transform: scale(1.05);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .difficulty-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .difficulty-selector label {
            margin-right: 15px;
            cursor: pointer;
        }
        
        .difficulty-selector input {
            margin-right: 5px;
        }
        
        .message {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 15px;
            min-height: 30px;
        }
        
        .message.success {
            color: #2ECC71;
        }
        
        .high-scores {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        
        .high-scores h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .high-scores ul {
            list-style: none;
            font-size: 0.9rem;
        }
        
        .high-scores li {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        @media (max-width: 400px) {
            .card {
                min-height: 60px;
                font-size: 1.5rem;
            }
            
            .board {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <a href="Game.html" class="back-link">← Back to Game Hub</a>
    
    <h1>🧩 Memory Match</h1>
    
    <div class="game-container">
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="pairs">0/8</div>
                <div class="stat-label">Pairs Found</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="timer">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>
        
        <div class="difficulty-selector">
            <label>
                <input type="radio" name="difficulty" value="easy" checked> Easy (4x4)
            </label>
            <label>
                <input type="radio" name="difficulty" value="hard"> Hard (4x5)
            </label>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button class="btn btn-primary" id="restart">🔄 New Game</button>
            <button class="btn btn-secondary" id="toggle-sound">🔊 Sound On</button>
        </div>
        
        <div class="high-scores">
            <h3>🏆 Best Scores (Easy)</h3>
            <ul id="high-scores-list">
                <li>No scores yet</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Audio Context for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }
        
        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            switch(type) {
                case 'flip':
                    oscillator.frequency.value = 600;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'match':
                    oscillator.frequency.value = 523.25;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    oscillator.start();
                    setTimeout(() => oscillator.frequency.value = 659.25, 100);
                    setTimeout(() => oscillator.frequency.value = 783.99, 200);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'nomatch':
                    oscillator.frequency.value = 200;
                    oscillator.type = 'triangle';
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'win':
                    const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.50];
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.2);
                        }, i * 100);
                    });
                    break;
            }
        }
        
        // Game State
        const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑', '🌟', '🎈'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameActive = false;
        let timerInterval = null;
        let seconds = 0;
        let totalPairs = 8;
        let highScores = JSON.parse(localStorage.getItem('memoryHighScores')) || [];
        
        const boardEl = document.getElementById('board');
        const movesEl = document.getElementById('moves');
        const pairsEl = document.getElementById('pairs');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restart');
        const toggleSoundBtn = document.getElementById('toggle-sound');
        const difficultyInputs = document.querySelectorAll('input[name="difficulty"]');
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        function createBoard() {
            boardEl.innerHTML = '';
            
            const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            totalPairs = difficulty === 'easy' ? 8 : 10;
            
            const selectedEmojis = emojis.slice(0, totalPairs);
            cards = shuffleArray([...selectedEmojis, ...selectedEmojis]);
            
            boardEl.style.gridTemplateColumns = difficulty === 'easy' ? 'repeat(4, 1fr)' : 'repeat(5, 1fr)';
            
            cards.forEach((emoji, index) => {
                const card = document.createElement('button');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <span class="card-back">❓</span>
                    <span class="card-content">${emoji}</span>
                `;
                card.addEventListener('click', handleCardClick);
                boardEl.appendChild(card);
            });
            
            updateHighScoresList();
        }
        
        function handleCardClick(e) {
            const card = e.currentTarget;
            const index = parseInt(card.dataset.index);
            
            // Don't allow clicking if game not active, card already flipped, or two cards already flipped
            if (!gameActive || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }
            
            // Start timer on first move
            if (moves === 0 && flippedCards.length === 0) {
                startTimer();
            }
            
            // Flip the card
            card.classList.add('flipped');
            flippedCards.push(card);
            playSound('flip');
            
            // Check for match when two cards are flipped
            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                
                const [card1, card2] = flippedCards;
                
                if (card1.dataset.emoji === card2.dataset.emoji) {
                    // Match!
                    setTimeout(() => {
                        card1.classList.add('matched');
                        card2.classList.add('matched');
                        matchedPairs++;
                        pairsEl.textContent = `${matchedPairs}/${totalPairs}`;
                        playSound('match');
                        
                        if (matchedPairs === totalPairs) {
                            gameWon();
                        }
                        
                        flippedCards = [];
                    }, 300);
                } else {
                    // No match
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        playSound('nomatch');
                        flippedCards = [];
                    }, 1000);
                }
            }
        }
        
        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function gameWon() {
            stopTimer();
            gameActive = false;
            messageEl.textContent = `🎉 Congratulations! You won in ${moves} moves!`;
            messageEl.classList.add('success');
            playSound('win');
            
            // Save high score
            const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            const score = { moves, time: seconds, difficulty, date: new Date().toLocaleDateString() };
            highScores.push(score);
            highScores.sort((a, b) => a.moves - b.moves);
            highScores = highScores.slice(0, 5); // Keep top 5
            localStorage.setItem('memoryHighScores', JSON.stringify(highScores));
            updateHighScoresList();
        }
        
        function updateHighScoresList() {
            const list = document.getElementById('high-scores-list');
            const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            const filteredScores = highScores.filter(s => s.difficulty === difficulty);
            
            document.querySelector('.high-scores h3').textContent = `🏆 Best Scores (${difficulty === 'easy' ? 'Easy' : 'Hard'})`;
            
            if (filteredScores.length === 0) {
                list.innerHTML = '<li>No scores yet</li>';
            } else {
                list.innerHTML = filteredScores.map((s, i) => `
                    <li>
                        <span>${i + 1}. ${s.moves} moves</span>
                        <span>${Math.floor(s.time / 60)}:${(s.time % 60).toString().padStart(2, '0')}</span>
                    </li>
                `).join('');
            }
        }
        
        function resetGame() {
            stopTimer();
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            seconds = 0;
            gameActive = true;
            
            movesEl.textContent = '0';
            pairsEl.textContent = `0/${totalPairs}`;
            timerEl.textContent = '0:00';
            messageEl.textContent = '';
            messageEl.classList.remove('success');
            
            createBoard();
            playSound('flip');
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            toggleSoundBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
        }
        
        // Event Listeners
        restartBtn.addEventListener('click', resetGame);
        toggleSoundBtn.addEventListener('click', toggleSound);
        difficultyInputs.forEach(input => {
            input.addEventListener('change', () => {
                resetGame();
                updateHighScoresList();
            });
        });
        
        // Initialize audio on first interaction
        document.addEventListener('click', initAudio, { once: true });
        
        // Start game
        createBoard();
        gameActive = true;
    </script>
</body>
</html>
