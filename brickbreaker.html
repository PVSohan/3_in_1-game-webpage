<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker - Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, hsl(243, 66%, 45%) 0%, #1a1a4e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #FFD700;
            text-decoration: none;
            font-size: 1.1rem;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFD700;
        }
        
        .stat-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        #gameCanvas {
            background: #1a1a2e;
            border-radius: 10px;
            display: block;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #FFD700;
            color: #333;
        }
        
        .btn-primary:hover {
            background: #FFC000;
            transform: scale(1.05);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .message {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 10px;
            min-height: 25px;
        }
        
        .instructions {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <a href="Game.html" class="back-link">← Back to Game Hub</a>
    
    <h1>🧱 Brick Breaker</h1>
    
    <div class="game-container">
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="level">1</div>
                <div class="stat-label">Level</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="lives">3</div>
                <div class="stat-label">Lives</div>
            </div>
        </div>
        
        <div class="message" id="message">Click to launch the ball!</div>
        
        <canvas id="gameCanvas" width="480" height="400"></canvas>
        
        <div class="controls">
            <button class="btn btn-primary" id="restart">🔄 New Game</button>
            <button class="btn btn-secondary" id="toggle-sound">🔊 Sound On</button>
        </div>
        
        <div class="instructions">
            Move mouse or touch to control paddle. Click to launch ball.
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;
        
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }
        
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            switch(type) {
                case 'brick':
                    osc.frequency.value = 500;
                    osc.type = 'square';
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'paddle':
                    osc.frequency.value = 300;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'wall':
                    osc.frequency.value = 200;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                    break;
                case 'lose':
                    osc.frequency.value = 150;
                    osc.type = 'sawtooth';
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'win':
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const o = audioCtx.createOscillator();
                            const g = audioCtx.createGain();
                            o.connect(g);
                            g.connect(audioCtx.destination);
                            o.frequency.value = freq;
                            o.type = 'sine';
                            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                            o.start();
                            o.stop(audioCtx.currentTime + 0.2);
                        }, i * 100);
                    });
                    break;
            }
        }
        
        // Game constants
        const paddleWidth = 80;
        const paddleHeight = 12;
        const ballRadius = 8;
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 50;
        const brickHeight = 20;
        const brickPadding = 8;
        const brickOffsetTop = 40;
        const brickOffsetLeft = 20;
        
        // Game state
        let paddleX = (canvas.width - paddleWidth) / 2;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 50;
        let ballDX = 4;
        let ballDY = -4;
        let ballLaunched = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let bricks = [];
        let gameRunning = false;
        let gameLoop = null;
        
        const brickColors = ['#E74C3C', '#F39C12', '#2ECC71', '#3498DB', '#9B59B6'];
        
        function createBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        color: brickColors[r % brickColors.length]
                    };
                }
            }
        }
        
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
                        
                        // Highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(brickX, brickY, brickWidth, 5);
                    }
                }
            }
        }
        
        function drawPaddle() {
            ctx.fillStyle = '#ECF0F1';
            ctx.fillRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, 3);
        }
        
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ECF0F1';
            ctx.fill();
            ctx.closePath();
        }
        
        function drawGame() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawPaddle();
            drawBall();
        }
        
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ballX > b.x && ballX < b.x + brickWidth && 
                            ballY > b.y && ballY < b.y + brickHeight) {
                            ballDY = -ballDY;
                            b.status = 0;
                            score += 10;
                            document.getElementById('score').textContent = score;
                            playSound('brick');
                            
                            // Check win
                            let bricksRemaining = 0;
                            for (let cc = 0; cc < brickColumnCount; cc++) {
                                for (let rr = 0; rr < brickRowCount; rr++) {
                                    bricksRemaining += bricks[cc][rr].status;
                                }
                            }
                            
                            if (bricksRemaining === 0) {
                                nextLevel();
                            }
                        }
                    }
                }
            }
        }
        
        function nextLevel() {
            level++;
            document.getElementById('level').textContent = level;
            playSound('win');
            
            ballDX *= 1.1;
            ballDY *= 1.1;
            
            createBricks();
            resetBall();
            document.getElementById('message').textContent = `Level ${level}! Click to launch`;
        }
        
        function resetBall() {
            ballLaunched = false;
            ballX = paddleX + paddleWidth / 2;
            ballY = canvas.height - 50;
        }
        
        function update() {
            if (!gameRunning) return;
            
            if (ballLaunched) {
                ballX += ballDX;
                ballY += ballDY;
                
                // Wall collision
                if (ballX + ballRadius > canvas.width || ballX - ballRadius < 0) {
                    ballDX = -ballDX;
                    playSound('wall');
                }
                if (ballY - ballRadius < 0) {
                    ballDY = -ballDY;
                    playSound('wall');
                }
                
                // Paddle collision
                if (ballY + ballRadius > canvas.height - paddleHeight - 10 &&
                    ballX > paddleX && ballX < paddleX + paddleWidth) {
                    ballDY = -Math.abs(ballDY);
                    
                    // Angle based on where ball hits paddle
                    const hitPos = (ballX - paddleX) / paddleWidth;
                    ballDX = 8 * (hitPos - 0.5);
                    playSound('paddle');
                }
                
                // Bottom - lose life
                if (ballY + ballRadius > canvas.height) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    playSound('lose');
                    
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        resetBall();
                        document.getElementById('message').textContent = 'Click to launch!';
                    }
                }
                
                collisionDetection();
            } else {
                ballX = paddleX + paddleWidth / 2;
            }
            
            drawGame();
            gameLoop = requestAnimationFrame(update);
        }
        
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(gameLoop);
            document.getElementById('message').textContent = '💀 Game Over! Click New Game to restart';
        }
        
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            ballDX = 4;
            ballDY = -4;
            paddleX = (canvas.width - paddleWidth) / 2;
            
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            document.getElementById('message').textContent = 'Click to launch!';
            
            createBricks();
            resetBall();
            gameRunning = true;
            update();
        }
        
        // Controls
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            paddleX = e.clientX - rect.left - paddleWidth / 2;
            paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, paddleX));
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            paddleX = e.touches[0].clientX - rect.left - paddleWidth / 2;
            paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, paddleX));
        });
        
        canvas.addEventListener('click', () => {
            initAudio();
            if (!gameRunning) {
                startGame();
            } else if (!ballLaunched) {
                ballLaunched = true;
                document.getElementById('message').textContent = '';
            }
        });
        
        document.getElementById('restart').addEventListener('click', () => {
            initAudio();
            if (gameLoop) cancelAnimationFrame(gameLoop);
            startGame();
        });
        
        document.getElementById('toggle-sound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('toggle-sound').textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
        });
        
        // Initial draw
        createBricks();
        drawGame();
    </script>
</body>
</html>
